# One-command hosting: Postgres + the KickLink web app.
#
#   cp .env.example .env   # then set AUTH_SECRET, POSTGRES_PASSWORD, NEXT_PUBLIC_APP_URL
#   docker compose up --build
#
# Then open http://localhost:3000. Put a reverse proxy (Caddy/Nginx) in front
# for HTTPS; it must set X-Real-IP so rate limits see real client addresses.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kicklink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kicklink
    volumes:
      - kicklink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kicklink"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets and integrations (AUTH_SECRET, Stripe, Resend, ...) come from .env.
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://kicklink:${POSTGRES_PASSWORD}@db:5432/kicklink?schema=public"
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    # Apply migrations on boot, then start the server.
    command: sh -c "node_modules/.bin/prisma migrate deploy && node server.js"

volumes:
  kicklink-db:
