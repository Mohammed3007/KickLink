name: Scheduled sweep

# Releases lapsed waitlist offers / checkout holds and retries owed refunds by
# calling the app's /api/cron/sweep endpoint. Vercel Hobby only allows daily
# cron jobs, so this runs the frequent schedule instead.
# Setup: repo variable APP_URL (e.g. https://kicklink.app) and repo secret
# CRON_SECRET matching the app's CRON_SECRET env var. Skipped until APP_URL is set.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call sweep endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail-with-body -sS -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/sweep"
